[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-battler-data-utils"
version = "0.1.0"
description = "Python scraping and data utility scripts for pokemon-battler"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "beautifulsoup4>=4.12",
  "html-table-parser-python3>=0.3.1",
  "selenium>=4.0",
  "natsort>=8.0",
]

[tool.setuptools]
py-modules = []
